name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: cd contracts && forge build --sizes
      - name: Shanghai opcode check
        run: node tools/check-shanghai.mjs contracts/out
      - name: Unit tests
        run: cd contracts && forge test --no-match-path 'test/fork/*' -vv
      - name: Probe the Aevum RPC (eth_chainId must be 0xabe5 = 44005)
        id: aevum
        run: |
          set -euo pipefail
          body='{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}'
          if reply=$(curl -sS --max-time 20 --retry 2 --retry-all-errors -H 'content-type: application/json' \
              --data "$body" https://rpc-test.qday.info) \
              && [ "$(echo "$reply" | jq -r '.result // empty')" = "0xabe5" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Fork tests INCONCLUSIVE::Aevum RPC unreachable (reply: ${reply:-none})"
            echo "### Fork tests: INCONCLUSIVE: Aevum RPC unreachable" >> "$GITHUB_STEP_SUMMARY"
            echo "eth_chainId on https://rpc-test.qday.info did not return 0xabe5. Fork tests were not run; this is not a pass." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Fork tests (real tUSD8 on Aevum)
        # Runs only when the RPC answered as 44005; then any failure fails the build.
        if: steps.aevum.outputs.reachable == 'true'
        run: cd contracts && forge test --match-path 'test/fork/*' --fork-url https://rpc-test.qday.info -vv

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # tests read Gloam's tree constants and the contracts' vector fixture
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install circom 2.2.3 (official release binary, sha256-pinned)
        # Same r1cs and wasm as a `cargo install --tag v2.2.3` build (sha256-compared 2026-11-20).
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 -o "$HOME/.local/bin/circom" \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $HOME/.local/bin/circom" | sha256sum -c -
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @shaida/proofs typecheck
      - name: Compile the income circuit
        run: pnpm --filter @shaida/proofs compile
      - name: Circuit and witness tests (Groth16 proving needs the local ptau, so it reports INCONCLUSIVE here)
        run: pnpm --filter @shaida/proofs test
      - name: Server store tests (Redis store over the in-memory fake; startup refusal)
        run: |
          pnpm --filter @shaida/kv typecheck
          pnpm --filter @shaida/kv test
      - name: Indexer tests
        run: |
          pnpm --filter @shaida/index typecheck
          pnpm --filter @shaida/index test
      - name: Relayer tests
        run: |
          pnpm --filter @shaida/relay typecheck
          pnpm --filter @shaida/relay test
      - name: Pay flow tests
        run: |
          pnpm --filter @shaida/pay typecheck
          pnpm --filter @shaida/pay test
      - name: Ceremony script tests (pure parts; the snarkjs steps need the ptau and run locally)
        run: |
          pnpm --filter @shaida/ceremony typecheck
          pnpm --filter @shaida/ceremony test

  web:
    # The same build Render runs (tools/render-build.sh, DEPLOY_RENDER.md): submodules, pinned circom, the income
    # circuit, then next build for Aevum testnet with every proving file copied only if its sha256 matches the pins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Render build
        env:
          NEXT_PUBLIC_NETWORKS: aevum
        run: bash tools/render-build.sh
      - run: pnpm -r typecheck

  gate:
    # BUILD_CONTRACT gate (tools/gate.sh) on this clean checkout. Exit 3 = INCONCLUSIVE (Aevum RPC unreachable, fork
    # tests not run): reported as a warning and in the summary, never as a pass of the fork step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0 # gate step 8 scans the whole git history
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install circom 2.2.3 (official release binary, sha256-pinned)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL --retry 3 -o "$HOME/.local/bin/circom" \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          echo "85342c7ff332d948df7c0c50ecf201e6129349aef550ce873f3c811b79fe53a3  $HOME/.local/bin/circom" | sha256sum -c -
          chmod +x "$HOME/.local/bin/circom"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install gitleaks 8.21.2 (official release, sha256 from its checksums.txt; gate step 8 fails without it)
        run: |
          curl -sSfL --retry 3 -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/.local/bin" gitleaks
          gitleaks version
      - name: make gate
        run: |
          set +e
          GATE_IN_PLACE=1 bash tools/gate.sh 2>&1 | tee gate.log
          code=${PIPESTATUS[0]}
          sed -n '/^| Step |/,$p' gate.log >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" = 3 ]; then
            echo "::warning title=Gate INCONCLUSIVE::fork tests not run (Aevum RPC unreachable); every other step passed"
            exit 0
          fi
          exit "$code"
